{{- if .Values.image.fluxAutomation.enabled -}}
{{- if $.Capabilities.APIVersions.Has "image.toolkit.fluxcd.io/v1" }}
apiVersion: image.toolkit.fluxcd.io/v1
{{- else }}
apiVersion: image.toolkit.fluxcd.io/v1beta2
{{- end }}
kind: ImageRepository
metadata:
  name: {{ include "platform-service.name" . }}
spec:
  provider: {{ default "azure" .Values.image.fluxAutomation.provider }}
  image: "{{ include "platform-service.imageRepository" . }}"
  interval: {{ .Values.image.fluxAutomation.interval }}
{{- with .Values.image.fluxAutomation.secretRef }}
  secretRef:
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
