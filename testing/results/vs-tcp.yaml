---
# Source: platform-service/templates/virtualservice.yaml
# TCP service
---
# Source: platform-service/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: test
spec:
  hosts:
    - "onehost-only.mydomain"
  gateways:
  - istio-system/global-https-internal-default-gateway
  tcp:
  - match:
    - port: 10010
    route:
    - destination:
       host: "test.test-ns.svc.cluster.local"
       port:
         number: 10010
---
# Source: platform-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: test
  labels:
    app: test
    app.kubernetes.io/name: test
    helm.sh/chart: platform-service-test
    app.kubernetes.io/instance: test-release
    version: v1
    state: stateful
  annotations:
    example: test
    example2: test2
spec:
  type: 
  ports:
    - port: 10010
      targetPort: 10010
      protocol: TCP
      name: tcp
  selector:
    app.kubernetes.io/name: test
    app: test
